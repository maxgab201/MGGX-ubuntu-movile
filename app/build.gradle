plugins {
    id 'com.android.application'
}

// La app siempre se firma con esta clave de depuración fija (versionada en
// ci/mggx-debug.keystore.b64), en vez de la clave de depuración autogenerada
// por Android Studio/Gradle en cada máquina. Así cualquier build -CI o local-
// queda firmado igual, y actualizar el APK nunca choca por firma distinta
// ("problema al analizar el paquete" / "conflicts with an existing package").
def mggxKeystoreB64 = file("$rootDir/ci/mggx-debug.keystore.b64")
def mggxKeystoreFile = file("$buildDir/mggx-debug.keystore")
if (mggxKeystoreB64.exists()) {
    mggxKeystoreFile.parentFile.mkdirs()
    mggxKeystoreFile.bytes = Base64.decoder.decode(mggxKeystoreB64.text.trim())
}

android {
    namespace 'com.mggx.ubuntu'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mggx.ubuntu'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.1.3'
    }

    signingConfigs {
        debug {
            if (mggxKeystoreFile.exists()) {
                storeFile mggxKeystoreFile
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    androidResources {
        noCompress += ['rootfs']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.termux.termux-app:terminal-view:0.118.0'
    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'
    implementation 'org.apache.commons:commons-compress:1.27.1'
}
